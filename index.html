<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hazr</title>
    <meta
      name="description"
      content="Hazr is a live map for earthquakes, weather, and hazard insights."

    <meta
      name="keywords"
      content="hazr, earthquakes, seismic activity, weather, hazards, map, alerts"
    />
    <meta name="author" content="Hazr" />

    <meta name="publisher" content="Hazr" />
    <meta name="metadata-base" content="https://hazr.vercel.app/" />

      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link rel="icon" type="image/webp" href="/brand.webp" />
    <link rel="apple-touch-icon" href="/brand.webp" />

    <meta property="og:title" content="Hazr" />
    <meta
      property="og:description"
      content="Real-time geospatial hazard dashboard using Vite, Mapcn (MapLibre), & Tailwind, unifying USGS earthquakes, & Open-Meteo weather into map."

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hazr.vercel.app/" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Real-time geospatial hazard dashboard using Vite, Mapcn (MapLibre), & Tailwind, unifying USGS earthquakes, & Open-Meteo weather into map."
    />
    <meta name="twitter:image" content="https://hazr.vercel.app/brand.webp" />

    <script type="application/ld+json">

            "@type": "WebSite",
            "@id": "https://hazr.vercel.app/#website",
